<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>{{CSS}}</style>{{LICENSE}}</head>
<body{{BODY_ATTR}}>
{{LOGO_DEFS}}
<div class="viewport"><div class="deck">{{SLIDES}}</div></div>
<nav class="toolbar" aria-label="演示控制">
<button id="prev" title="上一页（←）">上一页</button>
<label><input id="page-input" type="number" min="1" max="{{COUNT}}" value="1" aria-label="跳转页码"> / {{COUNT}}</label>
<button id="next" title="下一页（→）">下一页</button><span class="toolbar-divider"></span>
<button id="overview">总览</button><button id="fullscreen" title="按 16:9 比例完整适配屏幕">全屏</button><button id="notes">讲稿</button><button id="edit">编辑文字</button><button id="save">另存 HTML</button><button id="pptx" title="通用字体、可编辑的 PowerPoint 文件：文字、面板、图片与原生图表">导出 PPTX</button><button id="print" title="16:9 宽屏，一页一张；在打印窗口选择另存为 PDF">导出 PDF / 打印</button>
</nav>
<aside id="notes-panel" hidden><button id="close-notes">关闭</button><h2>讲稿与来源</h2><pre id="notes-content"></pre></aside>
<div id="status" role="status" aria-live="polite"></div><script>{{JS}}</script></body></html>
