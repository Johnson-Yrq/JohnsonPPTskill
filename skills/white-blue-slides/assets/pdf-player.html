<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@ · 全屏演示</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#eee;font:14px system-ui,sans-serif}
#stage{position:fixed;inset:0 0 64px;overflow:hidden;background:#000;touch-action:none}
#slide{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
#controls{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #ffffff26;border-radius:10px;background:#202126ed;white-space:nowrap}
button{border:0;border-radius:6px;padding:7px 11px;background:#ffffff12;color:inherit;font:inherit;cursor:pointer}button:hover{background:#ffffff26}button:disabled{opacity:.3;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #70afff;outline-offset:2px}
input{width:3.5em;border:0;border-radius:4px;background:#ffffff12;color:inherit;text-align:center;padding:6px;font:inherit}
#hint{color:#aeb1bd;font-size:12px}#status{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#222;padding:8px 14px;border-radius:6px}#status:empty{display:none}
:fullscreen #stage{bottom:0}:fullscreen #controls{opacity:0;pointer-events:none;transition:opacity .15s}:fullscreen.controls-visible #controls,:fullscreen #controls:focus-within{opacity:1;pointer-events:auto}:fullscreen:not(.controls-visible){cursor:none}
@media(max-width:650px){#hint{display:none}#controls{gap:6px}}
</style>
</head>
<body>
<main id="stage" aria-label="幻灯片"><img id="slide" alt="" draggable="false"></main>
<nav id="controls" aria-label="演示控制">
<button id="prev" aria-label="上一页">←</button>
<label><input id="page" type="number" min="1" value="1" aria-label="页码"> / <span id="total"></span></label>
<button id="next" aria-label="下一页">→</button>
<button id="fullscreen">全屏演示</button>
<span id="hint">← → 翻页 · F 全屏 · Esc 退出</span>
</nav>
<div id="status" role="status" aria-live="polite"></div>
<script type="application/json" id="pages">@@PAGES@@</script>
<script>
(() => {
  'use strict';
  const pages=JSON.parse(document.getElementById('pages').textContent);
  const $=id=>document.getElementById(id), root=document.documentElement;
  let current=0, request=0, timer, wheelAt=0, touch;
  $('total').textContent=pages.length; $('page').max=pages.length;
  function showControls(){
    root.classList.add('controls-visible'); clearTimeout(timer);
    timer=setTimeout(()=>root.classList.remove('controls-visible'),1800);
  }
  async function show(index){
    const n=Number.isFinite(index)?Math.max(0,Math.min(pages.length-1,index)):current;
    current=n; const id=++request;
    $('page').value=n+1; $('prev').disabled=n===0; $('next').disabled=n===pages.length-1;
    $('status').textContent='';
    const image=new Image(); image.src=pages[n];
    try{await image.decode();}catch{if(id===request)$('status').textContent='此页未能加载，请重新打开演示稿。';return;}
    if(id!==request)return;
    $('slide').src=image.src; $('slide').alt=`第 ${n+1} 页，共 ${pages.length} 页`;
    $('slide').dataset.page=n+1;
    history.replaceState(null,'','#'+(n+1));
  }
  async function fullscreen(){
    try{
      if(document.fullscreenElement)await document.exitFullscreen();
      else{document.activeElement?.blur();root.classList.remove('controls-visible');await root.requestFullscreen();}
    }catch{$('status').textContent='无法进入全屏，请使用浏览器打开此 HTML 后重试。';}
  }
  $('prev').onclick=()=>show(current-1); $('next').onclick=()=>show(current+1);
  $('page').onchange=()=>show(Math.trunc(Number($('page').value))-1);
  $('fullscreen').onclick=fullscreen;
  document.addEventListener('fullscreenchange',()=>{
    $('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏演示';
    root.classList.remove('controls-visible');
  });
  document.addEventListener('keydown',e=>{
    if(e.target instanceof HTMLInputElement)return;
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1);}
    else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(current-1);}
    else if(e.key==='Home'){e.preventDefault();show(0);}
    else if(e.key==='End'){e.preventDefault();show(pages.length-1);}
    else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen();}
  });
  document.addEventListener('pointermove',showControls);
  $('stage').addEventListener('click',e=>{if(e.pointerType!=='touch')show(current+1);});
  $('stage').addEventListener('wheel',e=>{
    e.preventDefault();if(Math.abs(e.deltaY)<12||Date.now()-wheelAt<400)return;
    wheelAt=Date.now();show(current+(e.deltaY>0?1:-1));
  },{passive:false});
  $('stage').addEventListener('touchstart',e=>{touch=e.touches[0].clientX;},{passive:true});
  $('stage').addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-touch;
    if(Math.abs(dx)>40)show(current+(dx<0?1:-1));else showControls();
  });
  window.addEventListener('hashchange',()=>show((parseInt(location.hash.slice(1),10)||1)-1));
  show((parseInt(location.hash.slice(1),10)||1)-1);
})();
</script>
</body>
</html>
